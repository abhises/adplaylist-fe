# /etc/nginx/sites-available/adplaylist-web (symlinked into sites-enabled).
# Own file, separate from the brasq site and the API site. TLS lines are
# added by certbot (see DEPLOY.md).

# www → no-www, same as Vercel did
server {
    server_name www.adplaylist.com www.nl.adplaylist.com;
    include snippets/adplaylist-gzip.conf;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / {
        set $bare $host;
        if ($host ~* ^www\.(.+)$) { set $bare $1; }
        return 301 https://$bare$request_uri;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    http2 on;
    ssl_certificate /etc/letsencrypt/live/adplaylist.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/adplaylist.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    server_name adplaylist.com nl.adplaylist.com;
    include snippets/adplaylist-gzip.conf;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    # Hashed build assets never change; let browsers keep them.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        # The site picks its language from the host (nl. → Dutch).
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    http2 on;
    ssl_certificate /etc/letsencrypt/live/adplaylist.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/adplaylist.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    if ($host = nl.adplaylist.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = adplaylist.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name adplaylist.com nl.adplaylist.com;
    include snippets/adplaylist-gzip.conf;
    return 404; # managed by Certbot




}
server {
    if ($host = www.nl.adplaylist.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = www.adplaylist.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name www.adplaylist.com www.nl.adplaylist.com;
    include snippets/adplaylist-gzip.conf;
    return 404; # managed by Certbot




}